# MANISK — Render one-click deployment blueprint.
#
# HOW TO DEPLOY (one time):
#   1. Make sure this file is on the repo's DEFAULT branch (main) — e.g.
#      merge the release PR. Render reads render.yaml from the default
#      branch and deploys that branch.
#   2. render.com → New → Blueprint → select this repository.
#   3. When prompted, enter the three secret values (below).
#   4. Apply. Render provisions PostgreSQL + the web service, builds the
#      Docker image, runs Alembic migrations at startup, and health-checks
#      /api/health. Every later push to main auto-deploys.
#
# SECRETS you will be prompted for (enter in Render's dashboard only —
# never commit them, never paste them in chat):
#   MANISK_AI_BASE_URL   your OpenAI-compatible provider endpoint
#   MANISK_AI_MODEL      the model name
#   MANISK_AI_API_KEY    your provider key
#
# AUTO-CONFIGURED (no manual entry):
#   MANISK_DATABASE_URL   wired from the mansik-db PostgreSQL instance
#   MANISK_SESSION_SECRET generated by Render (generateValue)
#
# OPTIONAL (add later in the dashboard):
#   MANISK_TAVILY_API_KEY  better web search (keyless DuckDuckGo otherwise)
#   MANISK_SMTP_*          real email sending (email.send tool)

databases:
  - name: mansik-db
    databaseName: mansik
    user: mansik
    plan: 0.1c-256mb          # smallest paid Postgres (Basic tier)
    region: singapore          # closest to India; must match the web service
    postgresMajorVersion: '16' # the version the test suite runs against

services:
  - type: web
    name: mansik
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: 0.5c-512mb           # Starter tier (always on)
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit  # redeploy on every push to main
    disk:                      # uploaded files persist across deploys
      name: mansik-files
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Render injects the internal Postgres connection string automatically.
      # (postgres://… is normalized to postgresql+psycopg2:// by the app.)
      - key: MANISK_DATABASE_URL
        fromDatabase:
          name: mansik-db
          property: connectionString
      - key: MANISK_ENVIRONMENT
        value: production
      - key: MANISK_FRONTEND_DIST
        value: /app/frontend/dist
      - key: MANISK_STORAGE_DIR
        value: /app/data/files
      - key: MANISK_COOKIE_SECURE
        value: "true"
      - key: MANISK_SESSION_SECRET
        generateValue: true   # Render generates & stores it securely
      - key: MANISK_AI_BASE_URL
        sync: false           # secret — enter when prompted
      - key: MANISK_AI_MODEL
        sync: false           # secret — enter when prompted
      - key: MANISK_AI_API_KEY
        sync: false           # secret — enter when prompted
