# MANISK — Render one-click deployment blueprint.
#
# Deploy: push this repo to GitHub → Render "New → Blueprint" → select the
# repo → create the secret env vars when prompted. Render provisions the
# PostgreSQL database and wires MANISK_DATABASE_URL automatically.
#
# Required SECRETS (set them in Render's dashboard — never commit them):
#   MANISK_SESSION_SECRET  — long random string (session/token signing)
#   MANISK_AI_BASE_URL     — your OpenAI-compatible provider, e.g.
#                            https://integrate.api.nvidia.com/v1 (NVIDIA NIM)
#   MANISK_AI_MODEL        — e.g. meta/llama-3.1-nemotron-70b-instruct
#   MANISK_AI_API_KEY      — your provider key
# Optional secrets:
#   MANISK_TAVILY_API_KEY  — better web search (keyless DuckDuckGo otherwise)
#   MANISK_SMTP_*          — real email sending (email.send tool)
databases:
  - name: mansik-db
    databaseName: mansik
    user: mansik
    plan: basic-256mb

services:
  - type: web
    name: mansik
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    dependsOn:
      - mansik-db
    databaseRefs:
      - mansik-db
    envVars:
      # Render injects the Postgres connection string automatically.
      - key: MANISK_DATABASE_URL
        fromDatabase:
          name: mansik-db
          property: connectionString
      - key: MANISK_ENVIRONMENT
        value: production
      - key: MANISK_FRONTEND_DIST
        value: /app/frontend/dist
      - key: MANISK_STORAGE_DIR
        value: /app/data/files
      - key: MANISK_COOKIE_SECURE
        value: "true"
      - key: MANISK_SESSION_SECRET
        generateValue: true   # Render generates & stores it securely
      - key: MANISK_AI_BASE_URL
        sync: false           # secret — set in dashboard
      - key: MANISK_AI_MODEL
        sync: false           # secret — set in dashboard
      - key: MANISK_AI_API_KEY
        sync: false           # secret — set in dashboard
      - key: MANISK_TAVILY_API_KEY
        sync: false           # optional secret
