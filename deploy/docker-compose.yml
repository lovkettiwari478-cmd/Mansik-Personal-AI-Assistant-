# MANISK — production compose file (API + built SPA + PostgreSQL).
# SQLite is fine for a single-user local instance, but production uses
# PostgreSQL (versioned Alembic migrations run automatically at startup).
#
# Usage:
#   cp .env.example .env   (fill in secrets — never commit .env)
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mansik
      POSTGRES_USER: mansik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mansik -d mansik"]
      interval: 10s
      timeout: 5s
      retries: 5

  mansik:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      MANISK_DATABASE_URL: postgresql+psycopg2://mansik:${POSTGRES_PASSWORD}@db:5432/mansik
      MANISK_STORAGE_DIR: /app/data/files
    volumes:
      - mansik_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  mansik_data:
