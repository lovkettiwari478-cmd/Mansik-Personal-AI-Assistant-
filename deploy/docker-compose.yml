# MANISK — production compose file.
# Usage: cp .env.example .env (fill in) && docker compose -f deploy/docker-compose.yml up -d --build
services:
  mansik:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Override file paths for the container volume
      MANISK_DATABASE_URL: sqlite:////app/data/mansik.db
      MANISK_STORAGE_DIR: /app/data/files
    volumes:
      - mansik_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: PostgreSQL instead of SQLite (set MANISK_DATABASE_URL accordingly)
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: mansik
  #     POSTGRES_USER: mansik
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  mansik_data:
